d .flipin{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:13px;border-radius:var(--radius);backface-visibility:hidden}.front{background:var(--card);border:1px solid var(--line)}.front strong{font:600 1rem Georgia,serif;color:var(--deep)}.front small{display:block;color:var(--soft);margin-top:6px}.backface{background:var(--accent);color:#fff;transform:rotateY(180deg);font-size:.86rem}.fact{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px}.fact b{min-width:275px;color:var(--deep)}.fact span{flex:1;color:var(--soft)}.learning h4{margin:0 0 7px;color:var(--deep);font-size:1rem}.learning p{margin:0;color:var(--soft);font-size:.9rem}.box{padding:16px 18px;border-radius:var(--radius);margin:10px 0 18px}.study{background:#5a4b9b0d;border-left:4px solid var(--accent)}.align{background:#d9a4411a;border:1px solid var(--ochre)}.portfolio{background:#fff;border:1px solid var(--accent)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.tag{background:var(--deep);color:#f4eedf;border-radius:999px;padding:5px 9px;font:11px monospace}.tag:nth-child(2){background:var(--accent)}.tag:nth-child(3){background:var(--clay)}.check{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.check li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.86rem}.check li:before{content:'✓';color:var(--good);font-weight:bold;margin-right:7px}.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}.q{margin-bottom:21px}.prompt{font-weight:bold;margin-bottom:9px}.opts{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.opt.selected{border-color:var(--accent);background:#5a4b9b0f}.opt.correct{border-color:var(--good);background:#3e7a4f19}.opt.incorrect{border-color:var(--bad);background:#b8412e14}.actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.primary,.ghost{font:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}.primary{border:0;background:var(--deep);color:#f4eedf;font-weight:bold}.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.score{font:12px monospace;color:var(--deep)}.done{margin-top:28px;padding:15px 17px;border:1px solid var(--ochre);background:#d9a44124;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.done small{margin-left:auto;color:var(--soft)}.footnav{display:flex;justify-content:space-between;margin-top:33px}@media(max-width:860px){.app{display:block}.sidebar{position:relative;width:100%;height:auto;padding:18px 0}.nav{display:flex;overflow:auto;gap:4px}.nav li{flex-shrink:0}.sidefoot{display:none}.main{padding:25px 18px 60px}.hero{padding:26px}.hero h2{font-size:1.5rem}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>Science, Investigated</h1><p>A shared Junior Cycle Science path</p></div><a class="back" href="index.html">← All subjects</a><ul class="nav" id="nav"></ul><div class="sidefoot">26 units across the Nature of Science, Physical World, Chemical World, Biological World, and Earth and Space, with investigation skills throughout.</div></aside><main class="main"><div class="top"><div class="crumb" id="crumb"></div><div class="progress"><div class="mosaic" id="mosaic"></div><div class="count"><b id="count">0</b>/26 units done together</div></div></div><div id="content"></div></main></div><script>
const KEY='jc-science-complete-v1';const RAW=[
['Working Like a Scientist','Nature of Science','Use questions, evidence, models, collaboration and careful communication to investigate how the world works.','Scientific inquiry|A systematic way to ask and answer questions using evidence.','Observation|Information gathered using senses or instruments.','Inference|Explanation based on observations and prior knowledge.','Hypothesis|Testable explanation or prediction.','Variable|Factor that can change in an investigation.','Evidence|Information supporting or challenging an explanation.'],
['Planning Fair Tests','Nature of Science','Design investigations that control variables, collect useful data and produce trustworthy conclusions.','Independent variable|Factor deliberately changed.','Dependent variable|Factor measured or observed.','Control variable|Factor kept the same for a fair comparison.','Fair test|Investigation changing one variable while controlling others.','Repeat|Doing a test again to improve confidence.','Reliability|How consistent results are when repeated.'],
['Measurement, Data and Graphs','Nature of Science','Measure accurately, choose units, present data clearly and identify patterns using tables and graphs.','Accuracy|Closeness of a measurement to its true value.','Precision|Closeness of repeated measurements to one another.','Mean|Total divided by number of values.','Anomaly|Result that does not fit the overall pattern.','Line graph|Graph showing relationship between continuous variables.','Bar chart|Graph comparing separate categories.'],
['Forces and Motion','Physical World','Explain how forces affect motion and apply ideas about speed, distance, time, friction and balanced forces.','Force|Push or pull that can change motion or shape.','Resultant force|Overall force after combining all forces.','Friction|Force resisting movement between surfaces.','Speed|Distance travelled per unit time.','Balanced forces|Forces equal in size and opposite in direction.','Acceleration|Rate at which velocity changes.'],
['Energy and Energy Transfers','Physical World','Identify energy stores and transfers and explain conservation, efficiency and everyday energy choices.','Energy store|Way energy is held, such as chemical or kinetic.','Energy transfer|Movement of energy between stores.','Conservation of energy|Energy cannot be created or destroyed, only transferred.','Efficiency|Useful output compared with total input.','Renewable energy|Energy source naturally replenished.','Insulation|Material reducing thermal energy transfer.'],
['Electricity and Circuits','Physical World','Build and interpret simple circuits using current, voltage, resistance and safe practical procedures.','Circuit|Complete path allowing electric current to flow.','Current|Rate of flow of electric charge.','Voltage|Energy transferred per unit charge.','Resistance|Opposition to electric current.','Series circuit|Circuit with components in one loop.','Parallel circuit|Circuit with separate branches.'],
['Light, Sound and Waves','Physical World','Explain reflection, refraction, sound, frequency and the use of waves in technologies and communication.','Wave|Transfer of energy without overall transfer of matter.','Frequency|Number of waves passing a point each second.','Amplitude|Maximum displacement from the rest position.','Reflection|Bouncing of a wave from a surface.','Refraction|Change in direction as a wave enters another medium.','Vibration|Back-and-forth movement producing waves or sound.'],
['Matter and Particle Theory','Chemical World','Use particle models to explain states of matter, changes of state, diffusion and gas pressure.','Particle model|Model representing matter as tiny moving particles.','Solid|State with particles closely packed and fixed in position.','Liquid|State with particles close together but able to move past each other.','Gas|State with particles far apart and moving freely.','Diffusion|Spreading of particles from high to low concentration.','Change of state|Physical change between solid, liquid and gas.'],
['Atoms, Elements and Compounds','Chemical World','Describe matter using atoms, elements, compounds, mixtures and the periodic table.','Atom|Smallest particle of an element retaining its properties.','Element|Pure substance made from one type of atom.','Compound|Substance with elements chemically combined.','Mixture|Substances physically combined but not chemically bonded.','Periodic table|Arrangement of elements by atomic structure and properties.','Molecule|Two or more atoms chemically bonded.'],
['Chemical Reactions','Chemical World','Recognise chemical change, describe reactions using word equations and investigate reaction evidence safely.','Reactant|Starting substance in a chemical reaction.','Product|New substance formed in a reaction.','Chemical reaction|Process creating new substances.','Conservation of mass|Mass is conserved in a closed chemical reaction.','Exothermic|Reaction releasing energy to surroundings.','Endothermic|Reaction taking energy from surroundings.'],
['Acids, Bases and pH','Chemical World','Investigate acids, bases, indicators, neutralisation and safe handling of chemicals in everyday and laboratory contexts.','Acid|Substance with pH below 7.','Base|Substance that can neutralise an acid.','Alkali|Soluble base.','pH scale|Scale indicating acidity or alkalinity.','Indicator|Substance changing colour with pH.','Neutralisation|Reaction between acid and base forming salt and water.'],
['Materials, Metals and Plastics','Chemical World','Relate material properties to structure, uses, recycling and environmental choices.','Property|Characteristic of a material such as hardness or conductivity.','Metal|Material generally conductive, strong and malleable.','Polymer|Large molecule made of repeating units; many plastics are polymers.','Alloy|Mixture containing a metal and other element(s).','Recycling|Processing materials for use again.','Biodegradable|Able to be broken down by living organisms.'],
['Cells and Microscopy','Biological World','Use microscopes and diagrams to explore cells as the basic units of life and distinguish plant and animal cells.','Cell|Smallest unit of living structure and function.','Nucleus|Cell structure containing genetic material.','Cell membrane|Boundary controlling movement into and out of a cell.','Cytoplasm|Jelly-like material where many reactions occur.','Cell wall|Rigid outer layer in plant cells.','Chloroplast|Plant-cell structure where photosynthesis occurs.'],
['Human Body Systems','Biological World','Explore how body systems work together to maintain life, including digestion, respiration, circulation and health.','Organ|Structure made of tissues with a particular job.','Organ system|Group of organs working together.','Respiration|Chemical reactions releasing energy from food.','Circulatory system|System moving blood around the body.','Digestive system|System breaking food into absorbable substances.','Homeostasis|Maintaining stable internal conditions.'],
['Plant Biology and Photosynthesis','Biological World','Investigate plant structure, photosynthesis, reproduction and the conditions needed for growth.','Photosynthesis|Process where plants use light to make glucose.','Chlorophyll|Green pigment absorbing light energy.','Stomata|Tiny leaf openings for gas exchange.','Pollination|Transfer of pollen to enable fertilisation.','Germination|Beginning of seed growth.','Limiting factor|Factor restricting rate of a process.'],
['Ecosystems and Biodiversity','Biological World','Explain relationships within ecosystems and investigate biodiversity, food webs and human impacts.','Ecosystem|Community of organisms and their environment.','Habitat|Place where an organism lives.','Biodiversity|Variety of living things in an area.','Food web|Interconnected feeding relationships.','Producer|Organism making its own food, usually by photosynthesis.','Conservation|Protection and management of species and habitats.'],
['Genetics, Evolution and Adaptation','Biological World','Explore inherited variation, natural selection, adaptation and evidence for evolution.','Gene|Section of DNA carrying information.','Inheritance|Passing characteristics from parents to offspring.','Variation|Differences between individuals of a species.','Adaptation|Feature increasing survival or reproduction in an environment.','Natural selection|Process in which helpful inherited variation becomes more common.','Evolution|Change in populations over many generations.'],
['Earth Structure and Rocks','Earth and Space','Describe Earth’s structure, classify rocks and explain the rock cycle, weathering and soil formation.','Crust|Thin outer layer of Earth.','Mantle|Thick layer of hot rock beneath the crust.','Igneous rock|Rock formed when molten material cools.','Sedimentary rock|Rock formed from compacted sediment.','Metamorphic rock|Rock changed by heat and pressure.','Rock cycle|Processes transforming rocks between types.'],
['Plate Tectonics and Natural Hazards','Earth and Space','Use plate tectonics to explain earthquakes, volcanoes and mountain formation and assess ways to reduce hazard impacts.','Tectonic plate|Large moving section of Earth’s outer layer.','Plate boundary|Zone where tectonic plates meet.','Earthquake|Sudden ground movement caused by energy release.','Volcano|Opening where molten rock, ash and gases can escape.','Hazard|Natural event with potential to cause harm.','Mitigation|Action reducing the impacts of a hazard.'],
['Weather, Climate and Atmosphere','Earth and Space','Distinguish weather from climate, gather weather data and explain human influence on atmospheric change.','Weather|Short-term atmospheric conditions.','Climate|Long-term average weather pattern.','Atmosphere|Layer of gases surrounding Earth.','Greenhouse effect|Warming caused by gases trapping outgoing heat.','Greenhouse gas|Gas contributing to the greenhouse effect.','Climate change|Long-term shift in climate patterns.'],
['Earth, Moon and Sun','Earth and Space','Explain day and night, seasons, phases of the Moon, eclipses and the scale of the Earth-Moon-Sun system.','Rotation|Spinning of an object on its axis.','Orbit|Path of one body around another.','Axis|Imaginary line about which Earth rotates.','Season|Annual pattern caused mainly by Earth’s tilted axis and orbit.','Moon phase|Changing apparent shape of the Moon.','Eclipse|One body moving into another’s shadow.'],
['Space, Stars and the Universe','Earth and Space','Explore the Solar System, stars, galaxies, evidence for an expanding universe and the role of space science.','Solar System|The Sun and objects orbiting it.','Star|Hot ball of gas producing light and energy.','Galaxy|Huge collection of stars, gas and dust.','Light year|Distance light travels in one year.','Universe|All space, time, matter and energy.','Telescope|Instrument gathering electromagnetic radiation from distant objects.'],
['Scientific Communication and Evidence','Nature of Science','Evaluate scientific claims, distinguish evidence from opinion and communicate scientific explanations for a chosen audience.','Claim|Statement that can be supported or challenged.','Peer review|Evaluation of scientific work by other experts.','Evidence-based|Supported by reliable observations or data.','Correlation|Association between variables, not proof of cause.','Causation|One factor directly contributing to another.','Scientific model|Simplified representation used to explain or predict.'],
['Extended Experimental Investigation','CBA 1 Planner','Plan an Extended Experimental Investigation: question and prediction, planning and conducting, processing and analysing, then reflecting and reporting.','Research question|Focused question that can be investigated.','Prediction|Expected outcome based on science ideas.','Method|Step-by-step investigation procedure.','Risk assessment|Identifying hazards and controls.','Results table|Organised record of measurements or observations.','Conclusion|Answer linked to results and scientific understanding.'],
['Science in Society Investigation','CBA 2 Planner','Investigate a scientific issue and its effect on society or the environment through research, communication, evaluation and reflection.','Science in society|How scientific ideas and applications affect people or environment.','Source credibility|Trustworthiness of a source and its evidence.','Technological application|Practical use of scientific knowledge.','Ethical issue|Question about right, fair or responsible action.','Stakeholder|Person or group affected by an issue.','Recommendation|Suggested action supported by evidence.'],
['Review: Connected Science','All strands','Connect physical, chemical, biological and Earth-and-space ideas through scientific inquiry, evidence, models and responsible action.','System|Interconnected parts working together.','Model|Simplified representation explaining a system.','Variable|Factor that can change.','Evidence|Information supporting an explanation.','Sustainability|Meeting present needs without harming future capacity.','Scientific literacy|Ability to use science ideas and evidence in life.']
];
const GENERAL=[['Question, evidence, explanation','A strong scientific response links an investigable question to data or observations and a clear explanation.'],['Control variables','For a fair comparison, change one factor deliberately and keep other important factors constant.'],['Evaluate before concluding','Comment on anomalies, repeats, accuracy, limitations and improvements before claiming certainty.']];const SPECIAL={0:['Turn an everyday observation into a testable scientific question.','Write a hypothesis using “if… then… because…”.','Identify the evidence that would support or challenge your explanation.'],1:['Plan a fair test and name independent, dependent and control variables.','Write a method that someone else could repeat safely.','Explain how repeated measurements improve confidence.'],2:['Create a results table with headings and units, then select an appropriate graph.','Calculate a mean and identify any anomaly.','Explain whether your graph supports a pattern, while noting limitations.'],5:['Draw a circuit diagram using standard symbols.','Predict what happens when another cell or lamp is added.','Explain how you would measure current or voltage safely.'],15:['Make a food web with at least five organisms.','Predict what could happen if one species declines sharply.','Propose a conservation action and explain likely trade-offs.'],23:['Choose a safe question related to the allowed investigation themes.','Plan prediction, variables, method, risk assessment, data table and analysis.','Write a conclusion that refers to results, limitations and realistic improvements.'],24:['Choose a scientific application affecting health, environment, technology or society.','Use more than one credible source and record evidence, viewpoint and limitation.','Communicate a balanced recommendation considering scientific, social, environmental and ethical issues.']};
const QUIZ=[['A hypothesis is',['A testable explanation or prediction','A final proven fact','A type of microscope','A graph only'],0],['The independent variable is',['The factor deliberately changed','The factor measured','A factor kept the same','An anomaly'],0],['Repeating an investigation mainly improves',['Reliability','The colour of equipment','The number of variables changed','Bias'],0],['A scientific conclusion should be based on',['Evidence and scientific explanation','A guess','One result only','A personal preference'],0],['A model is',['A simplified representation used to explain or predict','A laboratory hazard','A fixed law with no limits','A data table'],0]];const CBAQUIZ=[['An EEI research question should be',['Focused, safe and investigable','A final conclusion','Too broad to test','An opinion only'],0],['A risk assessment identifies',['Hazards and control measures','Only the final result','The best graph colour','A bibliography'],0],['An SSI explores',['A science issue and its impact on society or environment','Only one experiment result','A fictional story','A personal preference without evidence'],0],['Source credibility means',['Trustworthiness of source and evidence','How colourful a website is','The number of pictures','The length of a headline'],0],['A strong evaluation includes',['Evidence, limitations and reasoned recommendation','Only advantages','Only disadvantages','No conclusion'],0]];
let progress={},state={},view='home';try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(progress))}function nav(){let h='<li><button class="'+(view==='home'?'active':'')+'" onclick="go(\'home\')"><span class="num">⌂</span>Start here</button></li>';RAW.forEach((u,i)=>h+='<li><button class="'+(view===i?'active':'')+'" onclick="go('+i+')"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'+u[0]+(progress[i]?'<span class="dot"></span>':'')+'</button></li>');document.getElementById('nav').innerHTML=h}function meter(){document.getElementById('mosaic').innerHTML=RAW.map((_,i)=>'<i class="cell '+(progress[i]?'on':'')+'"></i>').join('');document.getElementById('count').textContent=Object.values(progress).filter(Boolean).length}function go(v){view=v;nav();v==='home'?home():unit(v);scrollTo({top:0,behavior:'instant'})}function home(){document.getElementById('crumb').textContent='Start here';document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">A path for two, at one pace</div><h2>Explore Junior Cycle Science by asking questions, testing ideas and using evidence.</h2><p>This 26-unit pathway builds knowledge across the Physical World, Chemical World, Biological World, and Earth and Space while the Nature of Science runs through every unit. It also provides structured support for the Extended Experimental Investigation and Science in Society Investigation.</p><div class="note"><b>How to use this:</b> learn the concepts, talk through the scientific habit, complete a short task and take the quiz. Save diagrams, results tables, calculations, evaluations and reflections in a Science portfolio.<br><br><b>Safety first:</b> practical work should follow teacher instructions, school risk assessments and suitable adult supervision. These units support learning; they do not replace laboratory safety procedures.</div></section><div class="title">All 26 units</div><div class="grid">'+RAW.map((u,i)=>'<article class="card start" onclick="go('+i+')"><div class="u">'+String(i+1).padStart(2,'0')+(progress[i]?' · done':'')+'</div><h3>'+u[0]+'</h3><div class="strand">'+u[1]+'</div></article>').join('')+'</div><div class="title">The scientist’s toolkit</div><div class="grid"><div class="card learning"><h4>Ask testable questions</h4><p>Turn curiosity into a focused question, prediction and fair method.</p></div><div class="card learning"><h4>Use evidence carefully</h4><p>Measure, repeat, represent data, explain patterns and identify limits.</p></div><div class="card learning"><h4>Communicate responsibly</h4><p>Use scientific vocabulary, evidence, uncertainty and ethical awareness.</p></div></div>'}function unit(i){let u=RAW[i],terms=u.slice(3).map(x=>x.split('|')),ex=SPECIAL[i]||['Choose a scientific question related to this topic and identify a relevant real-world context.','Create a labelled diagram, table, model or explanation using at least two key concepts.','Evaluate one limitation, uncertainty or ethical issue and suggest an improvement.'],st=state[i]||{a:{},checked:false};state[i]=st;let flips=terms.map(t=>'<div class="flip" onclick="this.classList.toggle(\'flipped\')"><div class="flipin"><div class="face front"><div><strong>'+t[0]+'</strong><small>tap to reveal</small></div></div><div class="face backface">'+t[1]+'</div></div></div>').join('');let facts=(i===3?[['Speed calculation','Speed = distance ÷ time. Always include units, for example m/s or km/h.'],['Balanced forces','An object can move at constant speed when forces are balanced.'],['Useful habit','Draw arrows to show forces and label their direction and size.']]:i===9?[['Chemical change creates new substances','Evidence may include temperature change, gas production, colour change or a precipitate.'],['Mass is conserved','In a closed system, total mass remains the same even though substances change.'],['Useful habit','Write word equations with reactants on the left and products on the right.']]:i===13?[['Respiration releases energy','Cells release energy from food through chemical reactions.'],['Systems work together','The digestive, respiratory and circulatory systems are interdependent.'],['Useful habit','Use labelled diagrams and trace the path of materials through the body.']]:i===23?[['EEI has four connected activities','Questioning and predicting; planning and conducting; processing and analysing; reflecting and reporting.'],['Plan before collecting data','The question, prediction, variables and method should fit together.'],['Evaluate honestly','A good report discusses reliability, anomalies, limitations and improvements.']]:i===24?[['SSI connects science with society','Investigate a scientific topic or issue and its effect on people or the environment.'],['Balance evidence and perspectives','Consider sources, stakeholders, benefits, risks and ethical questions.'],['Communicate a response','Use an appropriate format to share findings and a reasoned recommendation.']]:GENERAL).map(f=>'<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('');let qs=(i===23||i===24)?CBAQUIZ:QUIZ;let quiz=qs.map((q,n)=>'<div class="q"><div class="prompt">'+(n+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map((o,k)=>{let c='opt '+(st.a[n]===k?'selected':'');if(st.checked)c+=k===q[2]?' correct':(st.a[n]===k?' incorrect':'');return '<label class="'+c+'"><input type="radio" name="q'+i+'-'+n+'" '+(st.a[n]===k?'checked':'')+' '+(st.checked?'disabled':'')+' onchange="answer('+i+','+n+','+k+')">'+o+'</label>'}).join('')+'</div></div>').join('');let score=st.checked?'<span class="score">Score: '+qs.filter((q,n)=>st.a[n]===q[2]).length+'/'+qs.length+'</span>':'';document.getElementById('crumb').textContent='Unit '+String(i+1).padStart(2,'0');document.getElementById('content').innerHTML='<section class="unit-head"><div class="eyebrow">Unit '+String(i+1).padStart(2,'0')+' of 26 · '+u[1]+'</div><h2>'+u[0]+'</h2><div class="strand">A focus on inquiry, evidence, models and scientific communication</div><p class="intro">'+u[2]+'</p></section><div class="title">Key concepts · tap to flip</div><div class="grid">'+flips+'</div><div class="title">Worked examples and habits</div>'+facts+'<div class="title">Build confidence together</div><div class="grid"><div class="card learning"><h4>Explore</h4><p>'+ex[0]+'</p></div><div class="card learning"><h4>Investigate</h4><p>'+ex[1]+'</p></div><div class="card learning"><h4>Stretch</h4><p>'+ex[2]+'</p></div></div><div class="box study"><b>Scientific habit:</b> make a claim, support it with observations or data, explain it using scientific ideas, then identify a limitation, uncertainty or next question.</div><div class="box align"><h4 style="margin:0 0 8px">Junior Cycle learning connection</h4><p style="margin:0">This unit integrates scientific knowledge with the Nature of Science: inquiry, investigation, communication and appreciation of science in society.</p><div class="tags"><span class="tag">Scientific inquiry</span><span class="tag">Evidence and data</span><span class="tag">Science in society</span></div><ul><li>Ask questions and plan fair, safe approaches to investigation.</li><li>Collect, process, represent and evaluate evidence.</li><li>Communicate explanations and consider applications, limits and ethical implications.</li></ul><div class="box portfolio"><b>Portfolio evidence:</b> save a diagram, method, data table, graph, calculation, analysis, evaluation, research note or reflection. Add: “The scientific idea I can explain now is…”</div></div><div class="title">Active recall</div><ul class="check"><li>Define three concepts without looking.</li><li>Draw or describe one model or process.</li><li>Give one real-world application.</li><li>State one limitation, risk or question for further investigation.</li></ul><div class="title">Quick quiz</div><div class="quiz">'+quiz+'<div class="actions"><button class="primary" onclick="check('+i+')">'+(st.checked?'Re-check':'Check answers')+'</button><button class="ghost" onclick="reset('+i+')">Try again</button>'+score+'</div></div><div class="done"><label><input type="checkbox" '+(progress[i]?'checked':'')+' onchange="complete('+i+',this.checked)"> Mark this unit as done together</label><small>This only tracks progress on this device.</small></div><div class="footnav"><button class="ghost" '+(i===0?'disabled':'')+' onclick="go('+(i-1)+')">← Previous</button><button class="ghost" '+(i===RAW.length-1?'disabled':'')+' onclick="go('+(i+1)+')">Next →</button></div>'}function answer(i,n,k){if(state[i].checked)return;state[i].a[n]=k;unit(i)}function check(i){state[i].checked=true;unit(i)}function reset(i){state[i]={a:{},checked:false};unit(i)}function complete(i,v){progress[i]=v;save();nav();meter()}nav();meter();home();</script></body></html>
