<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="igt igd"><title id="igt">A comprehension layer inside the reading surface</title><desc id="igd">An existing reading surface with a highlighted passage; the reader triggers an inline visual that appears in place. It is a layer integrated into the page, not a standalone drop-in.</desc><rect width="600" height="470" fill="#F5F7FA"/><text x="40" y="46" font-family="'DM Mono',ui-monospace,monospace" font-size="12.5" letter-spacing="1.5" fill="#8A929E">INSIDE THE READING SURFACE</text><line x1="40" y1="62" x2="560" y2="62" stroke="#16191D" stroke-width="1.4"/><rect x="40" y="86" width="520" height="344" rx="12" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="1.2"/><text x="64" y="116" font-family="'DM Mono',ui-monospace,monospace" font-size="10.5" letter-spacing="1.2" fill="#8A929E">YOUR READING SURFACE</text><rect x="64" y="132" width="300" height="8" rx="4" fill="#E7EBF0"/><rect x="64" y="152" width="430" height="8" rx="4" fill="#E7EBF0"/><rect x="64" y="172" width="380" height="8" rx="4" fill="#E7EBF0"/><rect x="64" y="196" width="360" height="22" rx="3" fill="#0B5CD5" fill-opacity="0.14"/><line x1="64" y1="219" x2="424" y2="219" stroke="#0B5CD5" stroke-width="2" stroke-opacity="0.55"/><circle cx="452" cy="207" r="4" fill="#0B5CD5"/><path d="M452 213 l0 20 M452 233 l-6 -6 M452 233 l6 -6" stroke="#0B5CD5" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="468" y="205" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="11.5" fill="#5A626E" text-anchor="start">reader taps</text><rect x="64" y="248" width="472" height="150" rx="10" fill="#F5F7FA" stroke="#E4E9F0" stroke-width="1"/><rect x="64" y="248" width="472" height="26" rx="10" fill="none"/><text x="80" y="268" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="12.5" fill="#084099" text-anchor="start">Visual appears inline</text><circle cx="230" cy="338" r="20" fill="none" stroke="#0B5CD5" stroke-width="2"/><circle cx="370" cy="338" r="20" fill="#E8F0FC" stroke="#0B5CD5" stroke-width="2"/><path d="M250 338 L350 338" stroke="#0B5CD5" stroke-width="2"/><path d="M342 338 l-8 -5 M342 338 l-8 5" stroke="#0B5CD5" stroke-width="2" fill="none" stroke-linecap="round"/></svg>