<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 452" role="img" aria-labelledby="ct cd"><title id="ct">Getting in touch</title><desc id="cd">A message addressed to colm@aiaugmentedreading.com, with the three things that make a useful first reply: role and organisation, nature of the enquiry, and timeline.</desc><rect width="600" height="452" fill="#F5F7FA"/><text x="40" y="46" font-family="'DM Mono',ui-monospace,monospace" font-size="12.5" letter-spacing="1.5" fill="#8A929E">GET IN TOUCH</text><line x1="40" y1="62" x2="560" y2="62" stroke="#16191D" stroke-width="1.4"/><rect x="40" y="90" width="520" height="322" rx="12" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="1.2"/><text x="64" y="128" font-family="'DM Mono',ui-monospace,monospace" font-size="11" letter-spacing="1" fill="#8A929E">TO</text><text x="96" y="129" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15.5" fill="#084099">colm@aiaugmentedreading.com</text><line x1="64" y1="148" x2="536" y2="148" stroke="#E4E9F0" stroke-width="1"/><text x="64" y="184" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="14.5" fill="#16191D">What makes a useful first reply</text><circle cx="78" cy="224" r="11" fill="#0B5CD5"/><path d="M72.8 224.3 L76.4 228 L83.4 220" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="222" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15" fill="#16191D">Role and organisation</text><text x="104" y="241" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.6" fill="#5A626E">who you are and where you sit</text><circle cx="78" cy="282" r="11" fill="#0B5CD5"/><path d="M72.8 282.3 L76.4 286 L83.4 278" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="280" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15" fill="#16191D">Nature of the enquiry</text><text x="104" y="299" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.6" fill="#5A626E">method, demo, or partnership</text><circle cx="78" cy="340" r="11" fill="#0B5CD5"/><path d="M72.8 340.3 L76.4 344 L83.4 336" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="338" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15" fill="#16191D">Timeline</text><text x="104" y="357" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.6" fill="#5A626E">how soon you are looking to move</text></svg>