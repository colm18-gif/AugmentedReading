<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="cgt cgd"><title id="cgt">Why readers leave the page</title><desc id="cgd">A descriptive passage leads to two outcomes: without a visual the reader leaves the page to picture it and loses the thread; with an inline visual the reader stays on the page and keeps reading.</desc><rect width="600" height="440" fill="#F5F7FA"/><text x="40" y="46" font-family="'DM Mono',ui-monospace,monospace" font-size="12.5" letter-spacing="1.5" fill="#8A929E">THE COMPREHENSION GAP</text><line x1="40" y1="62" x2="560" y2="62" stroke="#16191D" stroke-width="1.4"/><rect x="188" y="92" width="224" height="86" rx="10" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="1.2"/><text x="300" y="116" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="13.5" fill="#16191D" text-anchor="middle">A descriptive passage</text><rect x="225.0" y="130" width="150" height="7" rx="3.5" fill="#E7EBF0"/><rect x="240.0" y="146" width="120" height="7" rx="3.5" fill="#E7EBF0"/><path d="M280 178 C230 210 175 214 150 236" fill="none" stroke="#B9C0CA" stroke-width="2" stroke-dasharray="5 5"/><path d="M150 236 l-2 -10 M150 236 l8 -6" stroke="#B9C0CA" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M320 178 C370 210 425 214 450 236" fill="none" stroke="#0B5CD5" stroke-width="2.2"/><path d="M450 236 l-8 -6 M450 236 l2 -10" stroke="#0B5CD5" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="52" y="244" width="216" height="128" rx="10" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="1.2"/><text x="72" y="278" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15" fill="#8A929E" text-anchor="start">Leaves the page</text><rect x="72" y="298" width="30" height="30" rx="5" fill="none" stroke="#B9C0CA" stroke-width="2"/><path d="M88 306 l10 -10 M92 296 l6 0 0 6 M96 302 l0 8 -14 0 0 -14 8 0" stroke="#B9C0CA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="352" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.5" fill="#5A626E" text-anchor="start">Loses the thread</text><rect x="332" y="244" width="216" height="128" rx="10" fill="#FFFFFF" stroke="#0B5CD5" stroke-width="1.6"/><text x="352" y="278" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="15" fill="#084099" text-anchor="start">Visual appears inline</text><circle cx="367" cy="313" r="13" fill="none" stroke="#0B5CD5" stroke-width="2"/><circle cx="401" cy="313" r="13" fill="#E8F0FC" stroke="#0B5CD5" stroke-width="2"/><path d="M380 313 l8 0" stroke="#0B5CD5" stroke-width="2"/><text x="352" y="352" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.5" fill="#5A626E" text-anchor="start">Stays, keeps reading</text></svg>