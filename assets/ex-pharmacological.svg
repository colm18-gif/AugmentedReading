<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="pt pd"><title id="pt">Beta-blockade of the cardiac signalling cascade</title><desc id="pd">Adrenaline binding a beta-1 receptor triggers a cascade through G protein, adenylyl cyclase and cyclic AMP, raising heart rate. A beta-blocker occupies the receptor and interrupts the cascade at its first step.</desc><rect width="480" height="320" fill="#FFFFFF"/><g font-family="Inter,'DejaVu Sans',sans-serif"><text x="26" y="32" font-size="12.5" font-weight="600" fill="#16191D">Beta-blockade</text><text x="26" y="48" font-size="11" fill="#5A626E">where the drug interrupts the cascade</text></g><defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0B5CD5"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A929E"/></marker></defs><text x="126" y="84" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#C0392B" text-anchor="middle">adrenaline</text><circle cx="126" cy="110" r="15" fill="#FBEAE8" stroke="#C0392B" stroke-width="1.7"/><text x="126" y="114" font-family="Inter,'DejaVu Sans',sans-serif" font-size="12" fill="#C0392B" font-weight="600" text-anchor="middle">A</text><text x="252" y="84" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#084099" text-anchor="middle">beta-blocker</text><circle cx="252" cy="110" r="15" fill="#E8F0FC" stroke="#0B5CD5" stroke-width="1.8"/><text x="252" y="114" font-family="Inter,'DejaVu Sans',sans-serif" font-size="12" fill="#084099" font-weight="600" text-anchor="middle">B</text><rect x="26" y="150" width="428" height="22" fill="#F6F8FA" stroke="#E3E6EA"/><text x="30" y="146" font-family="Inter,'DejaVu Sans',sans-serif" font-size="9.5" fill="#8A929E">cell membrane</text><rect x="109" y="142" width="34" height="38" rx="5" fill="#FFFFFF" stroke="#16191D" stroke-width="1.8"/><text x="152" y="166" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#16191D" font-weight="600">β₁ receptor</text><path d="M126 128 L126 138" stroke="#C0392B" stroke-width="2.2" fill="none" marker-end="url(#pr)"/><path d="M239 116 C196 122 166 132 148 146" stroke="#0B5CD5" stroke-width="2.2" fill="none" marker-end="url(#pa)"/><g stroke="#0B5CD5" stroke-width="3.2" stroke-linecap="round"><path d="M112 194 L132 214"/><path d="M132 194 L112 214"/></g><text x="142" y="210" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10.5" fill="#084099" font-weight="600">cascade interrupted</text><rect x="22" y="248" width="98" height="32" rx="4" fill="#FFFFFF" stroke="#8A929E" stroke-width="1.3"/><text x="29" y="268" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#5A626E">G protein</text><rect x="134" y="248" width="98" height="32" rx="4" fill="#FFFFFF" stroke="#8A929E" stroke-width="1.3"/><text x="141" y="268" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#5A626E">adenylyl cyclase</text><rect x="246" y="248" width="98" height="32" rx="4" fill="#FFFFFF" stroke="#8A929E" stroke-width="1.3"/><text x="253" y="268" font-family="Inter,'DejaVu Sans',sans-serif" font-size="10" fill="#5A626E">cAMP → PKA</text><rect x="358" y="246" width="100" height="36" rx="4" fill="#FBEAE8" stroke="#C0392B" stroke-width="1.6"/><text x="366" y="264" font-family="Inter,'DejaVu Sans',sans-serif" font-size="11" fill="#C0392B" font-weight="600">heart rate</text><text x="366" y="277" font-family="Inter,'DejaVu Sans',sans-serif" font-size="9.5" fill="#8A929E">rises</text><g fill="none" stroke="#8A929E" stroke-width="1.7" marker-end="url(#pg)"><path d="M114 182 C104 210 90 230 76 242"/><path d="M122 264 L128 264"/><path d="M234 264 L240 264"/><path d="M346 264 L352 264"/></g><text x="26" y="296" font-family="Inter,'DejaVu Sans',sans-serif" font-size="11.5" fill="#5A626E">Cascade and point of action taken from the passage</text><rect x="0" y="314" width="480" height="6" fill="#0B5CD5"/></svg>