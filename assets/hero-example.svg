<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" role="img" aria-labelledby="ht hd"><title id="ht">A reader highlights a passage and a diagram appears beneath it</title><desc id="hd">A passage about blood returning to the right atrium, with two sentences highlighted, and a labelled cardiac schematic rendered inline below showing four chambers, both valves and an ECG trace.</desc><rect width="760" height="660" fill="#F7F3EC"/><text x="44" y="64" font-family="Georgia,'Source Serif 4',serif" font-size="21" fill="#221F1A">Deoxygenated blood returns via the vena cava</text><text x="44" y="97" font-family="Georgia,'Source Serif 4',serif" font-size="21" fill="#221F1A">to the right atrium.</text><rect x="39" y="109" width="506" height="29" fill="#0B5CD5" fill-opacity="0.15" rx="2"/><path d="M39 138 L545 138" stroke="#0B5CD5" stroke-width="2" stroke-opacity="0.6"/><text x="44" y="130" font-family="Georgia,'Source Serif 4',serif" font-size="21" fill="#221F1A">It passes through the tricuspid valve into the</text><rect x="39" y="142" width="388" height="29" fill="#0B5CD5" fill-opacity="0.15" rx="2"/><path d="M39 171 L427 171" stroke="#0B5CD5" stroke-width="2" stroke-opacity="0.6"/><text x="44" y="163" font-family="Georgia,'Source Serif 4',serif" font-size="21" fill="#221F1A">right ventricle, then to the lungs.</text><g><path d="M380 176 L380 196" stroke="#0B5CD5" stroke-width="2"/><path d="M373 190 L380 199 L387 190" fill="none" stroke="#0B5CD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="42" y="212" width="676" height="454" fill="#FFFFFF" stroke="#221F1A" stroke-opacity="0.16"/><g transform="translate(44 214) scale(1.1198)"><g fill="none" stroke="#16191D" stroke-width="2.2" stroke-linecap="round"><path d="M206 88 L206 44"/><path d="M188 196 C170 150 152 108 150 66"/><path d="M348 196 C348 130 386 92 428 104 C452 111 460 134 456 154"/><path d="M392 128 C420 124 436 126 448 132"/></g><g stroke="#16191D" stroke-width="2.2"><path d="M