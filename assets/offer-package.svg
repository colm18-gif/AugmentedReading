<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 516" role="img" aria-labelledby="pkt pkd"><title id="pkt">What the partnership package includes</title><desc id="pkd">Five components: a working demonstration, the codebase under NDA, a chemistry proof of concept, the design judgment, and the IP position.</desc><rect width="600" height="516" fill="#F5F7FA"/><text x="40" y="46" font-family="'DM Mono',ui-monospace,monospace" font-size="12.5" letter-spacing="1.5" fill="#8A929E">THE PACKAGE</text><line x1="40" y1="62" x2="560" y2="62" stroke="#16191D" stroke-width="1.4"/><rect x="40" y="93" width="38" height="38" rx="8" fill="#E8F0FC"/><text x="59" y="117" font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#084099" text-anchor="middle">01</text><text x="96" y="109" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D" text-anchor="start">Working demonstration</text><text x="96" y="129" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E" text-anchor="start">Thirteen chapters, live in the demo</text><line x1="40" y1="152" x2="560" y2="152" stroke="#E4E9F0" stroke-width="1"/><rect x="40" y="173" width="38" height="38" rx="8" fill="#E8F0FC"/><text x="59" y="197" font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#084099" text-anchor="middle">02</text><text x="96" y="189" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D" text-anchor="start">Codebase</text><text x="96" y="209" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E" text-anchor="start">Working prototype, under NDA</text><line x1="40" y1="232" x2="560" y2="232" stroke="#E4E9F0" stroke-width="1"/><rect x="40" y="253" width="38" height="38" rx="8" fill="#E8F0FC"/><text x="59" y="277" font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#084099" text-anchor="middle">03</text><text x="96" y="269" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D" text-anchor="start">Proof of concept</text><text x="96" y="289" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E" text-anchor="start">Deterministic chemistry rendering</text><line x1="40" y1="312" x2="560" y2="312" stroke="#E4E9F0" stroke-width="1"/><rect x="40" y="333" width="38" height="38" rx="8" fill="#E8F0FC"/><text x="59" y="357" font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#084099" text-anchor="middle">04</text><text x="96" y="349" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D" text-anchor="start">Design judgment</text><text x="96" y="369" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E" text-anchor="start">Schema, output selection, failure handling</text><line x1="40" y1="392" x2="560" y2="392" stroke="#E4E9F0" stroke-width="1"/><rect x="40" y="413" width="38" height="38" rx="8" fill="#E8F0FC"/><text x="59" y="437" font-family="'DM Mono',ui-monospace,monospace" font-size="14" fill="#084099" text-anchor="middle">05</text><text x="96" y="429" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D" text-anchor="start">IP position</text><text x="96" y="449" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E" text-anchor="start">Irish Short-Term Patent</text></svg>