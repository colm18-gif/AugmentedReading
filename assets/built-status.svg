<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 578" role="img" aria-labelledby="bt bd"><title id="bt">Build status of AI Augmented Reading</title><desc id="bd">Eight components marked as built, prototype or not yet: chemistry rendering (prototype), other domains (not yet), demo visuals (built), codebase (prototype), content compatibility (built), reader control (built), efficacy data (not yet), production integration (not yet).</desc><rect width="600" height="578" fill="#F5F7FA"/><text x="40" y="46" font-family="'DM Mono',ui-monospace,monospace" font-size="12.5" letter-spacing="1.5" fill="#8A929E">BUILD STATUS</text><line x1="40" y1="62" x2="560" y2="62" stroke="#16191D" stroke-width="1.4"/><circle cx="44" cy="96" r="11" fill="none" stroke="#0B5CD5" stroke-width="2"/><path d="M44 85 A11 11 0 0 0 44 107 Z" fill="#0B5CD5"/><text x="84" y="94" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D">Chemistry rendering</text><text x="84" y="113" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E">Deterministic proof of concept</text><line x1="40" y1="124" x2="560" y2="124" stroke="#E4E9F0" stroke-width="1"/><circle cx="44" cy="152" r="11" fill="none" stroke="#B9C0CA" stroke-width="2"/><text x="84" y="150" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D">Other domains</text><text x="84" y="169" font-family="'Inter',-apple-system,sans-serif" font-weight="400" font-size="12.8" fill="#5A626E">Illustrative of the method</text><line x1="40" y1="180" x2="560" y2="180" stroke="#E4E9F0" stroke-width="1"/><circle cx="44" cy="208" r="11" fill="#0B5CD5"/><path d="M38.8 208.3 L42.4 212 L49.4 204" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="206" font-family="'Inter',-apple-system,sans-serif" font-weight="500" font-size="16.5" fill="#16191D">Demo visuals</text><text x="84" y="